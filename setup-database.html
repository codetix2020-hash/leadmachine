    <button onclick="setupDatabase()" style="padding: 20px; font-size: 18px; cursor: pointer;">
        Click Here to Setup Database

    <div id="log" style="margin-top: 20px; white-space: pre-wrap; font-family: monospace;"></div>

    <script>
        const SUPABASE_URL = 'https://llquwqbqzlpycemxuxur.supabase.co'
        const SUPABASE_SERVICE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxscXV3cWJxemxweWNlbXh1eHVyIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTczNTkxMDgxNywiZXhwIjoyMDUxNDg2ODE3fQ.fKeTg6pvLgnooRYqPUjgw_BQcHmC83'

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_SERVICE_KEY)

        function log(message) {
            document.getElementById('log').innerHTML += message + '\n'
            console.log(message)
        }

        async function setupDatabase() {
            log('🚀 Starting database setup...\n')

            const SQL = \`-- LEADMACHINE Schema

-- Extensiones necesarias
CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

-- Tabla de leads
CREATE TABLE IF NOT EXISTS leads (
  id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
  company_name TEXT NOT NULL,
  email TEXT,
  phone TEXT,
  linkedin_url TEXT,
  instagram_url TEXT,
  website TEXT,
  type TEXT NOT NULL CHECK (type IN ('codetix', 'reservaspro')),
  score INTEGER DEFAULT 0 CHECK (score >= 0 AND score <= 100),
  status TEXT DEFAULT 'new' CHECK (status IN ('new', 'contacted', 'interested', 'call_scheduled', 'closed', 'lost')),
  industry TEXT,
  location TEXT,
  employee_count INTEGER,
  problem_detected TEXT,
  insight TEXT,
  created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
  updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
);

-- Tabla de conversaciones
CREATE TABLE IF NOT EXISTS conversations (
  id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
  lead_id UUID NOT NULL REFERENCES leads(id) ON DELETE CASCADE,
  channel TEXT NOT NULL CHECK (channel IN ('email', 'linkedin', 'whatsapp', 'instagram')),
  message_sent TEXT NOT NULL,
  message_received TEXT,
  sentiment TEXT CHECK (sentiment IN ('interested', 'needs_info', 'not_now', 'not_interested', 'auto_reply')),
  created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
);

-- Tabla de secuencias de outreach
CREATE TABLE IF NOT EXISTS outreach_sequences (
  id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
  lead_id UUID NOT NULL REFERENCES leads(id) ON DELETE CASCADE,
  sequence_type TEXT NOT NULL,
  current_step INTEGER DEFAULT 1,
  next_action_date TIMESTAMP WITH TIME ZONE,
  status TEXT DEFAULT 'active' CHECK (status IN ('active', 'paused', 'completed')),
  created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
  updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
);

-- Tabla de analytics
CREATE TABLE IF NOT EXISTS analytics (
  id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
  date DATE NOT NULL UNIQUE,
  leads_found INTEGER DEFAULT 0,
  messages_sent INTEGER DEFAULT 0,
  open_rate FLOAT DEFAULT 0,
  response_rate FLOAT DEFAULT 0,
  calls_scheduled INTEGER DEFAULT 0,
  deals_closed INTEGER DEFAULT 0,
  revenue_generated FLOAT DEFAULT 0,
  created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
);

-- Índices para mejorar performance
CREATE INDEX IF NOT EXISTS idx_leads_type ON leads(type);
CREATE INDEX IF NOT EXISTS idx_leads_status ON leads(status);
CREATE INDEX IF NOT EXISTS idx_leads_score ON leads(score DESC);
CREATE INDEX IF NOT EXISTS idx_leads_created_at ON leads(created_at DESC);
CREATE INDEX IF NOT EXISTS idx_conversations_lead_id ON conversations(lead_id);
CREATE INDEX IF NOT EXISTS idx_conversations_channel ON conversations(channel);
CREATE INDEX IF NOT EXISTS idx_conversations_created_at ON conversations(created_at DESC);
CREATE INDEX IF NOT EXISTS idx_outreach_sequences_lead_id ON outreach_sequences(lead_id);
CREATE INDEX IF NOT EXISTS idx_outreach_sequences_status ON outreach_sequences(status);
CREATE INDEX IF NOT EXISTS idx_outreach_sequences_next_action_date ON outreach_sequences(next_action_date);
CREATE INDEX IF NOT EXISTS idx_analytics_date ON analytics(date DESC);

-- Función para actualizar updated_at automáticamente
CREATE OR REPLACE FUNCTION update_updated_at_column()
RETURNS TRIGGER AS $$
BEGIN
  NEW.updated_at = NOW();
  RETURN NEW;
END;
$$ LANGUAGE plpgsql;

-- Triggers para actualizar updated_at
CREATE TRIGGER update_leads_updated_at
  BEFORE UPDATE ON leads
  FOR EACH ROW
  EXECUTE FUNCTION update_updated_at_column();

CREATE TRIGGER update_outreach_sequences_updated_at
  BEFORE UPDATE ON outreach_sequences
  FOR EACH ROW
  EXECUTE FUNCTION update_updated_at_column();\`

            try {
                log('📝 Executing SQL...')
                
                const { data, error } = await supabase.rpc('exec_sql', { query: SQL })
                
                if (error) {
                    log('❌ Error: ' + error.message)
                    log('\n⚠️ PLEASE DO THIS MANUALLY:')
                    log('1. Go to: https://supabase.com/dashboard/project/llquwqbqzlpycemxuxur/editor')
                    log('2. Click "SQL Editor"')
                    log('3. Copy the SQL from this page')
                    log('4. Paste and Run it')
                } else {
                    log('✅ Success! Database tables created.')
                    
                    // Verify
                    log('\n🔍 Verifying tables...')
                    const tables = ['leads', 'conversations', 'outreach_sequences', 'analytics']
                    for (const table of tables) {
                        const { data, error } = await supabase.from(table).select('count').limit(1)
                        if (error) {
                            log(`❌ ${table}: ${error.message}`)
                        } else {
                            log(`✅ ${table}: OK`)
                        }
                    }
                }
            } catch (error) {
                log('❌ Error: ' + error.message)
            }
        }
    </script>
